name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: check-readme-map
        run: python3 scripts/check-readme-map
      - name: check-skill-contracts
        run: python3 scripts/check-skill-contracts
      - name: test-check-readme-map
        run: bash scripts/test-check-readme-map
